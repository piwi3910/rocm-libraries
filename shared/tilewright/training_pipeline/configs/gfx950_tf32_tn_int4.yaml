config_id: gfx950_tf32_tn_int4
arch: gfx950
hipblaslt:
  a_type: f32_r
  b_type: f32_r
  c_type: f32_r
  d_type: f32_r
  scale_type: f32_r
  compute_type: c_xf32_r
  transA: T
  transB: N
# ${VAR} paths are expanded by run_orchestrator.py at load (unset -> error);
# export TILEWRIGHT_BENCH_ROOT / TILEWRIGHT_DEPLOY_ROOT for gfx950 runs.
runtime:
  devices: [0, 1, 2, 3, 4, 5, 6, 7]
  rocm_libraries_root: ${TILEWRIGHT_BENCH_ROOT}
seed:
  target_per_cell: 400
  shapes_per_cell: 150
  rotating_mb: 512
  seed: 42
  n_strata: 2
probe:
  first_line_iters: 10
  first_line_cold_iters: 10
  other_lines_iters: 1
  other_lines_cold_iters: 0
  duration_us: 2000
  skip_ratio_mode: sigmoid
  skip_ratio_min: 0.05
  skip_ratio_max: 0.95
  skip_ratio_center_us: 30
  skip_ratio_k: 1.5
bench:
  blocks_per_gpu: 50
train:
  workers: 48
  threads_per_worker: 0
  epochs: 200
  device: cpu
  eval_sample_frac: 1.0
  smart_k: 15
  smart_k_max: 25
  smart_k_min: 5
  smart_k_saturation_eps: 0.005
  min_cell_gemms: 30
validate:
  sel_eff_threshold: 0.95
  min_cell_gemms: 20
  split_floor: 0.83
  split_min_improvement: 0.02
  split_after_attempts: 1
  max_split_depth: 6
  structural_split_min_octaves: 6.0
full:
  total_rounds: 8
# Weak-cell hardening (O4) explicitly DISABLED: it inflated cell count, binary
# size and selection time without reliably improving the weak tail.
hardening:
  enabled: false
deploy:
  target_sel_eff: 0.95
  on_final_round: true
  stop_when_target_reached: false
  # int4 weight storage: ~8x smaller .bin than fp32 with minimal quality loss.
  weight_dtype: int4
  rocm_libraries_to_deploy: ${TILEWRIGHT_DEPLOY_ROOT}
  apply_patch: true
  # Relink libOrigami + mosaic + hipblaslt-bench so the deployed runtime picks
  # up the matching fixes (config_ml drop -> i_dim 12 / x_dim 37, int4 reader).
  build_after_apply: true
  build_jobs: null
stage07:
  # Stage 7 times + C++/Python pick-parity-checks this many random UNIQUE
  # shapes SAMPLED FROM THE TRAINED DATASET (union of every round_*/stage01/
  # shapes.yaml) -- the in-distribution shapes the deployed cells actually
  # serve, guaranteed to match this config's dtype/layout.
  parity_sample_trained: 1000
stage08:
  # xf32 T/N (TF32_TN). A mixed real-world workload yaml also works: stage
  # 8's workload filter (transA=T, transB=N, xf32) isolates its TF32_TN
  # shapes. Raw yamls are freshly benched, so omit rocm_libraries_used for
  # them (enrichment must use the same library stage 8 benched with).
  # Empty: add `{name, path, rocm_libraries_used}` entries (paths may use
  # ${TILEWRIGHT_DATASETS}) to evaluate on external traces.
  datasets: []
