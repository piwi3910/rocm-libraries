# MXFP8 / TN / gfx1250v0 (gfx1250, ASIC revision v0) configuration for
# the ML recommender pipeline.
#
# TARGET LIBRARY:
#   .../Logic/asm_full/gfx1250v0/gfx1250v0/Origami/
#     gfx1250v0_Cijk_Alik_Bljk_F8BS_MXAE8B32_MXBE8B32_BH_Bias_HA_S_SAV_UserArgs.yaml
#   whose ProblemType is DataType/DataTypeA/DataTypeB 15 (Float8, OCP e4m3),
#   DestDataType 7 (BFloat16), ComputeDataType 0 (Float/f32),
#   DataTypeMXSA/DataTypeMXSB 22 (E8 == E8M0 scales), MXBlockA/MXBlockB 32,
#   TransposeA true / TransposeB false (TN).
#   Built .dat stem:
#     TensileLibrary_F8F8_BF8_HA_MXAE8B32_MXBE8B32_Bias_SAV_UA_Type_F8B_
#       HPA_Contraction_l_Alik_Bljk_Cijk_Dijk_gfx1250
#
# THIS IS NOT configs/gfx950_f8bs_tn.yaml's datatype. That config is
# plain F8 with a per-tensor SCALAR scale (scaleA/scaleB: 1 ->
# hipblaslt_scaling_format::Scalar, matching `UseScaleAB: Scalar`), which
# on gfx1250 is a DIFFERENT library:
#   ..._F8F8_BF8_HA_Bias_SAB_SAV_UA_...
# Both decode to the same (a_type, d_type, compute_type, transA, transB)
# 5-tuple, so the scale mode is the ONLY thing that separates them --
# which is why lib/dat.py now carries a per-pattern scale mode and
# load_configs_from_dat() filters on it. Getting this wrong silently
# trains against the wrong kernel pool.
#
# Derived from configs/gfx950_bbs_tn.yaml; every comment below that is
# not marked "gfx1250v0:" still applies verbatim. The gfx1250v0-specific
# deltas are:
#
#   arch: gfx1250v0 -- NOT "gfx1250". Both ASIC revisions compile to the
#     same LLVM target (the logic yamls all say `ArchitectureName:
#     gfx1250`), but they ship SEPARATE tuning trees, and this config
#     targets v0 silicon. hipBLASLt picks the subtree at runtime from
#     the probed asicRevision: tensile_host.cpp looks for
#     `<libdir>/<library_arch_name>/`, which is `gfx1250v0` here.
#     IMPORTANT: that promotion happens ONLY when HIPBLASLT_TENSILE_LIBPATH
#     is UNSET -- setting it pins the path verbatim and silently gives you
#     the v1 library. Leave it unset (scripts/run_gfx1250v0.sh unsets it);
#     the bench root below must have `Tensile/library/gfx1250v0/` in place
#     so both the runtime promotion and this pipeline's derived `dat_dir`
#     land on the same v0 kernels.
#
#   runtime.rocm_libraries_root -- ${TILEWRIGHT_BENCH_ROOT}: the checkout
#     (or a pinned snapshot of one) whose built hipblaslt-bench + Tensile
#     library the run benchmarks. run_orchestrator.py expands ${VAR} and ~
#     in every config string at load time and refuses to run if a variable
#     is unset. scripts/run_gfx1250v0.sh exports TILEWRIGHT_BENCH_ROOT and
#     TILEWRIGHT_DEPLOY_ROOT, both defaulting to the rocm-libraries checkout
#     this pipeline lives in (PIN_DIR is accepted as an alias for the bench
#     root). Pin it: a rebuild mid-run with commits that ADD AND REMOVE
#     Origami kernels would change the candidate set under the benchmark,
#     not merely its timings. A hardlink snapshot is free and immune to the
#     originals being replaced; a PINNED_COMMIT file in its root records
#     the commit (scripts/run_gfx1250v0.sh prints it).
#
#   runtime.devices: [0,1,2,3] -- a 4-GPU node, not 8.
#
#   train.workers: 32 -- sized for a smaller host than the gfx950 configs
#     (which use 48); threads_per_worker: 0 gives each cpu_count//workers.
#
#   bench.blocks_per_gpu -- kept LOW. The gfx1250v0 Origami library is
#     large (the tha1/thb1 TemporalHint variants triple the TN Origami
#     pool), so per-process library init is expensive and is paid once per
#     block. Fewer, larger blocks amortise it; the cost is coarser load
#     balancing.
#
#   seed/full budgets trimmed relative to the gfx950 configs so a run can
#     finish unattended on 4 GPUs rather than 8; see the per-key comments.
#     Resume with --run-dir <existing> --from-round R --from-stage N.
#
# `config_id` identifies this OOB CONFIGURATION (arch + dtype + layout).
# Not to be confused with a "grid cell" (one of the 96 categorical
# regions of (M, N, K, B) tier space; see `seed.target_per_cell`).
config_id: gfx1250v0_bbs_tn
arch: gfx1250v0
# hipblaslt-bench yaml type fields. Mirror the val pool yamls so hash-
# based dedup works across rounds.
hipblaslt:
  a_type: bf16_r
  b_type: bf16_r
  c_type: bf16_r
  d_type: bf16_r
  scale_type: f32_r
  compute_type: c_f32_r
  # scaleA/scaleB are hipblaslt-bench SCALING-FORMAT MODES, not values
  # (clients/common/include/hipblaslt_scaling_format.hpp):
  #   0 none | 1 Scalar | 2 Vector | 3 Block_32_UE8M0 | 4 Block_16_UE8M0
  #   5 Block_32_UE4M3 | 6 Block_16_UE4M3 | 7 Block_32_UE5M3 | 8 Block_16_UE5M3
  # Mode 3 == Block_32_UE8M0 == E8M0 scales over blocks of 32, i.e. exactly
  # the MXAE8B32_MXBE8B32 in the target library's filename and the
  # DataTypeMXSA/B=22 + MXBlockA/B=32 in its ProblemType.
  #
  # Cross-checked against a reference hipblaslt-bench sweep yaml,
  # whose MXFP8 line is f8_r/f8_r -> bf16_r with scaleA: 3, scaleB: 3
  # (its plain-f8 line uses 0, and its MXFP4 line uses f4_r with 3).
  #
  # NOTE the Origami ProblemType still reports `UseScaleAB: ''` -- MX
  # scales are NOT UseScaleAB; they are the separate MXSA/MXSB operands.
  # So "UseScaleAB is empty" must not be read as "use scale mode 0" here.
  scaleA: 0
  scaleB: 0
  transA: T
  transB: N

# Host-side runtime: GPUs available + root of the rocm-libraries
# checkout this run targets. Build paths are derived from the root
# (orchestrator computes bench_binary, dat_dir, match_table,
#  origami_python_path automatically using the standard rocm-libraries
#  layout).
runtime:
  devices: [0, 1, 2, 3]
  # FULL library, including the TemporalHint variants. A TH-free library
  # initializes much faster but is NOT used: dropping the
  # Origami_tha1/thb1 trees deletes real kernels, not just redundant ones.
  # THA1 sets temporal-hint bits on buffer_load and can be genuinely faster on
  # some shapes; a tuning sweep exists to FIND those wins, so removing the
  # variants trades tuning quality for init speed -- the wrong trade here.
  # The aliasing that motivated it (origami sees cache_hints_a/b = 0 for all
  # three, so model_equivalent_to collapses them) is a FEATURE gap: the fix is
  # to expose the TH fields to the model, not to delete the kernels.
  # Expanded at load time and must be set; scripts/run_gfx1250v0.sh exports
  # it. See the header for what it points at and why to pin it.
  rocm_libraries_root: ${TILEWRIGHT_BENCH_ROOT}

# Stage 01 OOB seed defaults.
seed:
  # The budget is spent on ROUNDS, not on one huge round: stage06 deploy +
  # stage07 parity only fire on the FINAL round, so a run that does not
  # finish delivers nothing shippable.
  # Cost model:
  #   per-block   one lazy kernel-module load before the first shape
  #   per-fault   another module load (stage03 respawns the bench)
  #   effective   per-shape marginal + fault_rate x module_load
  # A module load costs far more than a shape, so faults dominate the cost.
  # Requires the K >= 8000 known-faulting filter in lib/shapes.py (see
  # is_known_faulting), which keeps them rare.
  # Sized to the TRAINING gate, not to a shape count. stage05_train.py
  # skips any cell holding fewer than train.min_cell_gemms GEMMs, so
  # round_0 must put at least that many in every cell or nothing trains.
  # Keep headroom above the gate where the budget allows: stage01 can
  # under-fill a cell slightly (pool = target*3, then global + history
  # dedup), and a cell that lands one short is silently dropped.
  # round_0 = 96 cells x target_per_cell shapes, spread over
  # len(devices) x blocks_per_gpu blocks.
  # BBS_TN is far more expensive per shape than MXFP8 on gfx1250v0: it has
  # more Origami candidates, each bf16 candidate is slower to measure, and
  # its larger code object makes every module load (per block AND per
  # fault) longer. At the usual gate (min_cell_gemms 30) round_0 alone
  # would overrun the time budget, so 12/10 (target_per_cell /
  # min_cell_gemms) keeps 2 rounds (stage04b + held-out metrics need >= 2).
  # This trades model quality for completion -- raise both for a quality run.
  # Sized with the observed-fault blocklist (lib/shapes.py) active: a fault
  # that recurs on the same shape is skipped instead of paying another
  # bench respawn.
  # 2 rounds (not 3) is deliberate: round_1 is final so nothing splits, and
  # splitting at this budget can REDUCE quality (children fall below
  # min_cell_gemms and deploy as untrained leaves).
  target_per_cell: 12
  # Active rounds. Gated by validate.min_cell_gemms: stage04b needs that
  # many NEW shapes in a cell to score and split it, so anything below it
  # leaves cells unevaluated and the split tree frozen.
  # The orchestrator also passes train.min_cell_gemms to stage01 in active
  # rounds as a per-LEAF floor (--min-cell-gemms), so the effective budget
  # is max(this, train.min_cell_gemms) regardless -- stating at least that
  # here keeps the config honest about the cost.
  # Per-round shape count = leaves x shapes_per_cell, so leaf growth IS the
  # cost driver.
  shapes_per_cell: 12
  rotating_mb: 512            # rotating buffer stamp on every bench line
  seed: 42                    # rng seed for shape synthesis
  # Per-axis log-equal strata for WITHIN-cell corner coverage. 1 =
  # legacy pure log-uniform on the whole cell box; 2 = octant
  # stratification (8 sub-boxes per cell); 4 = quartiles (64
  # sub-boxes). Higher = more guaranteed corner coverage at the cost
  # of smaller per-sub-box sample budgets. Use 4 once target_per_cell
  # is comfortably above 64; leave at 1 for tiny per-cell budgets.
  #
  # Set to 2 (octant stratification): with the widened Large/LargeK
  # ceilings (lib/grid.py) a Large cell box now spans ~9 octaves, so
  # pure log-uniform (n_strata=1) clusters samples at the geometric
  # MIDDLE (~2k) and under-covers the high-magnitude decade where real
  # workloads live. n_strata=2 guarantees the top sub-box (large M/N/K)
  # gets its share of the budget; the adaptive splitter then carves by
  # magnitude over rounds.
  n_strata: 2

# Stage 02 probe: measure each shape's representative `us` quickly,
# then calibrate per-shape iters / cold_iters / skip_slow_solution_ratio
# so every shape's main bench runs for ~`duration_us` of measured wall-
# time per kernel. The output is ONE shapes_probed.yaml ready for
# stage03 (load-balanced bench).
probe:
  # Knobs for the probe pass itself (cheap; only used to GET the `us`):
  first_line_iters: 10            # first line of each probe-split yaml
  first_line_cold_iters: 10
  other_lines_iters: 1            # all subsequent lines: 1 iter, 0 cold
  other_lines_cold_iters: 0

  # Knobs the probe writes into the FINAL per-shape line stamps.
  # `duration_us` is the ONLY thing that drives iters -- no min/max
  # cap; the script just clamps iters at >=1 (the bench tool's hard
  # floor) so we never emit `iters: 0`. cold_iters always == iters.
  duration_us: 2000               # target wall-time per kernel measurement
  # skip_slow_solution_ratio mode:
  #   sigmoid -- continuous logistic ramp in log-latency, bounded to
  #              [skip_ratio_min, skip_ratio_max]; slow GEMMs prune harder,
  #              fast/near-tied GEMMs prune little (protects winner label).
  #   bucket  -- legacy 2-tier (fast_us_threshold -> ratio_light/ratio_heavy).
  skip_ratio_mode: sigmoid
  skip_ratio_min: 0.05            # lightest prune (fast / near-tied GEMMs)
  skip_ratio_max: 0.95            # heaviest prune (very slow GEMMs)
  skip_ratio_center_us: 30        # 50% pivot latency (us)
  skip_ratio_k: 1.5               # logistic steepness in ln(probe_us/center)
  # Legacy bucket knobs (consulted only when skip_ratio_mode: bucket):
  fast_us_threshold: 30           # probe_us < this -> "fast" -> ratio_light
  ratio_light: 0.3                # skip_slow_solution_ratio for fast shapes
  ratio_heavy: 0.8                # for slow shapes

# Stage 03 bench (per-GPU work queue + crash recovery).
bench:
  # A full rsn=-1 sweep pays its lazy kernel-module load ONCE per process,
  # then a much smaller cost per additional shape. stage03 runs one process
  # per BLOCK, so per-GPU load overhead = blocks_per_gpu x that load.
  #
  # Finer blocks load-balance better across heterogeneous shapes and make
  # progress legible (a block completes every few minutes instead of hourly),
  # but every block re-pays the load. A smaller candidate pool shrinks it:
  # the TemporalHint short-circuit evaluates one of {non-TH, THA1, THB1}
  # instead of all three.
  # At small per-round budgets one block per GPU is the cheapest option:
  # block count is also the number of kernel-module loads paid per round.
  blocks_per_gpu: 1

  # DISABLED. The warm-up ran with skip_slow_solution_ratio: 0 so it would
  # touch every candidate -- which also made it the ONE pass most likely to
  # reach a kernel that faults. A block whose warm-up stalls loses the whole
  # block, while blocks that get past their warm-up bench cleanly with normal
  # pruning.
  #
  # What it was protecting against is negligible by comparison: without it only
  # each block's FIRST shape screens against cold (not-yet-resident) kernel
  # modules -- one shape per block -- because everything is resident from the
  # second shape on. Trading that sliver of slightly-noisy pruning for
  # whole-block losses is a bad trade.
  #
  # Re-enable only if the faulting kernels are fixed upstream, or if the
  # warm-up is changed to prune like a real shape (ssr matching bench.
  # skip_slow_solution_ratio) rather than forcing all candidates.
  warmup_pass: false

  # Kill a bench sub-run whose log has not grown for this long and treat it as
  # a crash, so stage03's existing recovery skips the offending GEMM.
  #
  # A GPU memory fault does NOT reliably kill hipblaslt-bench: a candidate
  # kernel can fault with HSA_STATUS_ERROR_MEMORY_APERTURE_VIOLATION and the
  # process WEDGES, holding the device with its pipe open, while the other
  # GPUs keep finishing whole blocks.
  #
  # A healthy block streams output continuously, so a long silence is always
  # abnormal -- this is a bound on the cost of each fault, not a budget for
  # real work. 0 disables the watchdog.
  # Budget for the FIRST byte of output from a freshly spawned bench. This is
  # kernel-module load time, NOT a stall, and it grows when several GPUs load
  # concurrently.
  #
  # Why a separate grace: with only stall_timeout_s, the watchdog kills
  # benches before they print their first line, marks innocent GEMMs (even
  # tiny ones) as crashed with rc=-9 and no real fault, then respawns into the
  # same trap. A bench killed mid-hipModuleLoad is stuck in uninterruptible D
  # state holding GPU resources and cannot be reaped, and such a cascade can
  # wedge the GPU until a reboot.
  # Larger for BBS. The grace covers the LAZY kernel-module load, which
  # happens on first launch AFTER "Is supported N" is printed. BBS ranks more
  # candidates from a larger code object than MXFP8, so shape 1 is silent for
  # far longer; an MXFP8-sized grace can kill every block before it reports a
  # single winner.
  startup_grace_s: 2400
  # Gap between writes once the process IS producing output. Only meaningful
  # after the first byte; see startup_grace_s above.
  # Larger for BBS. This is the gap between writes once the process is
  # producing output, and some BBS shapes legitimately stay silent longer than
  # an MXFP8-sized timeout -- large-M x small-N at high K, with every
  # candidate timed. Those are slow, not stalled.
  stall_timeout_s: 1200

  # Candidate pruning, applied by the bench BEFORE the timed measurement:
  # a solution is dropped when  warm_up * ratio > best_warm_up_seen, i.e. 0.5
  # skips anything slower than 2x the best so far. This library offers hundreds
  # of TN MXFP8 candidates per shape; without pruning every one is fully timed.
  # stage02 used to derive this per shape from probe_us -- with adaptive timing
  # stage02 is gone, so it is a fixed value here. It still works under
  # `adaptive` (the client keeps one cold call precisely to run this screen).
  # 0.5 leaves a 2x margin so a genuinely fast kernel is never pruned.
  skip_slow_solution_ratio: 0.5

  # -- rotating buffer --------------------------------------------------------
  # `rotating` is a MiB budget the bench divides by the problem footprint to
  # get a BLOCK COUNT (how many cold copies to cycle through, to defeat cache
  # reuse between iterations). A FIXED budget is pathological for small
  # problems: at 512 MiB a 2x3x32 MXFP8 GEMM asked for 2,130,441 copies of a
  # 252-byte problem. lib/bench_yaml.py now sizes the budget PER SHAPE so the
  # block count lands near `rotating_target_blocks`, capped at `rotating_mb`,
  # and emits 0 (rotation off) when the problem is too small for rotation to
  # mean anything. NOTE: this is `bench.rotating_mb`, not the long-dead
  # `seed.rotating_mb` above it, which nothing has ever read.
  rotating_mb: 512            # hard cap on the per-shape budget
  rotating_target_blocks: 16  # aim for ~this many cold copies

  # -- adaptive timing --------------------------------------------------------
  # Replaces the fixed iters/cold_iters count, and with it the entire stage02
  # probe: hipblaslt-bench warms up, collects timed samples, and stops when the
  # mean's relative standard error is under `noise_threshold` (status
  # `converged`), when the robust spread plateaus (`stable`), or at the ceiling
  # (`noisy`). stage02 existed only to back-calculate an iteration count; the
  # bench now does that per kernel with the variance actually in hand.
  #
  # THE KEYS BELOW ARE THE `Arguments` STRUCT FIELD NAMES, NOT the --adaptive_*
  # command-line spellings. A yaml key of `adaptive_measure_time` is silently
  # ignored and you inherit the 500 ms default measure floor -- hundreds of
  # times this budget, per kernel.
  adaptive:
    enabled: true
    warmup_time: 1.0          # ms of warm-up before timing starts
    sample_time: 0.5          # ms target per timed sample (batch size)
    # Per-shape cost is ~(candidates timed) x the adaptive budget.
    measure_time: 1.5
                              # probe.duration_us: 2000 this replaces
    # This is the TAIL, and it dominates: a solution that never meets
    # noise_threshold runs to this ceiling, so the ceiling, not measure_time,
    # sets most of the per-shape cost. Keep it tight.
    # noise_threshold stays at 5% on purpose -- loosening it would let noisier
    # timings through, and those timings ARE the training labels.
    max_measure_time: 8.0
    min_iters: 3              # floor on timed iterations
    max_iters: 0              # 0 = unbounded (the time ceiling governs)
    noise_threshold: 0.05     # 5% relative standard error = converged. Looser
                              # than the 1% default on purpose: this pipeline
                              # RANKS kernels, it does not publish absolute
                              # numbers, and 1% costs iterations for precision
                              # that changes no ordering.

# Stage 05 training.
train:
  # Per-cell training parallelism. workers>1 trains cells concurrently in
  # a thread-capped `spawn` process pool over train_cell() -- validated
  # BIT-IDENTICAL to sequential (per-cell torch.manual_seed) and much
  # faster, because the prior naive attempt's failure (every torch worker
  # grabbing every core -> thread oversubscription -> stall) is fixed by hard
  # per-worker thread caps. threads_per_worker=0 AUTO-sizes to
  # cpu_count//workers so the whole machine is used (workers x threads ~=
  # cpu_count). Origami baseline / smart_K / deployed eval
  # stay serial in the parent (cheap vs the 200-epoch train).
  workers: 32
  threads_per_worker: 0
  epochs: 200
  device: cpu                # torch device: cpu | cuda | cuda:0 | hip
  # stage05 trains the student (and the LightGBM teacher) on ALL of
  # each cell's GEMMs -- there is no per-cell train/val split inside
  # stage05. The "sel_eff" reported per-epoch in stage05 is therefore
  # TRAINING-SET accuracy by design (reference only). The REAL
  # selection-efficiency signal -- on unknown shapes -- comes from
  # the NEXT round's stage04b (active-round validate; logical stage
  # 4.5), where stage01's history-dedup guarantees those GEMMs were
  # never trained on. Weights are randomly reinitialized on every
  # retrain (no warm-start from the prior round); cross-round
  # augmentation comes from training data, not from initial weights.
  #
  # `eval_sample_frac` just controls how many GEMMs the per-epoch
  # report covers (1.0 = all GEMMs, the configured default). Set
  # lower only as a speed knob on very large cells.
  eval_sample_frac: 1.0
  smart_k: 15                # Per-cell candidate cap after the
                             # check_lds_capacity + is_kernel_feasible
                             # pre-filter. The cell's K kernel
                             # SIGNATURES are chosen post-training by
                             # student-aware greedy max-coverage
                             # (select_smart_k_signatures), stored in
                             # models.pt / the deployed .bin, and the
                             # deploy runtime + stage 7 parity check
                             # both filter to exactly that list.
                             # `smart_k` is the legacy fixed target
                             # used when adaptive-K is OFF.
  # ── Adaptive-K (opt-in) ──────────────────────────────────────────
  # When `smart_k_max` is set, the per-cell list is grown to k_max
  # then truncated at the regret-curve knee in [smart_k_min,
  # smart_k_max]: cells whose coverage saturates early keep a SHORT
  # list (selection-time win) and cells still improving keep a LONGER
  # list up to k_max (better whitelist coverage on OOD shapes).
  # Parity-safe: the runtime + parity check read
  # whatever-length list ships, so NO C++ change is needed. Comment
  # `smart_k_max` out to fall back to the fixed `smart_k` above.
  smart_k_max: 25            # grow up to 20 sigs for coverage-limited cells
  smart_k_min: 5             # floor; saturated cells shrink to here
  smart_k_saturation_eps: 0.005   # stop growing K once the next sig
                                  # adds < 0.5 pp sel_eff (knee also
                                  # requires full GEMM coverage)
  # round_0 trains every populated cell; round_R (R>=1) retrains only
  # the cells stage04b marks as failing. In BOTH cases the training set
  # is the UNION of every round's enriched data (cross-round data
  # augmentation).
  min_cell_gemms: 10   # BBS cost forces this; see target_per_cell

# Stage 4.5 active-learning iteration (stage04b on disk).
validate:
  # PASS cutoff. Accepts a numeric value in (0, 1] (e.g. 0.95) OR the
  # literal string `origami`, in which case the per-cell PASS
  # threshold = that cell's measured Origami sel_eff this round --
  # i.e. "the trained model must do at least as well as plain
  # Origami". If the Origami baseline failed for that cell, falls
  # back to 0.95.
  # 0.95 rather than a looser bar: wide cells (e.g. Large|Large|LargeK)
  # can PASS a looser bar on same-distribution synthetic shapes and get
  # carried forever, yet score markedly lower on real OOD data. At
  # 0.95 the whole sub-0.95 band stays active (retrain/split-eligible),
  # so those wide cells keep getting augmented data and get carved by
  # magnitude until they actually clear the bar on held-out shapes.
  sel_eff_threshold: 0.95
  # If a cell has fewer than this many NEW GEMMs after the bench, the
  # per-cell sel_eff is too noisy to trust -- we conservatively mark
  # that cell for retrain rather than risk a "PASS" call on bad data.
  min_cell_gemms: 10   # gates stage04b; must be <= shapes_per_cell
  # Adaptive cell splitting. A cell becomes a SPLIT candidate when
  # its measured held-out `sel_eff_new` (the new shapes this round)
  # is below `split_floor`. Split candidates are DEMOTED to plain
  # retrain until the cell has been retrained `split_after_attempts`
  # times -- i.e. data augmentation gets that many shots before we
  # carve. Only after that does stage04b actually split the cell.
  #
  # Split-AXIS selection (when a cell is carved):
  #   1. TIER-FIRST: restrict candidate axes to those at the WIDEST
  #      base-cell tier (M / N: Tiny < Small < Mid < Large; K:
  #      TinyK < MidK < LargeK). Stops the pipeline from carving an
  #      already-Tiny / TinyK axis when M or N has more room.
  #   2. Among those, pick the axis with the largest CART variance-
  #      reduction gain on the prior round's per-GEMM log_ratios.
  #   3. Threshold = the cell's log-median value on the chosen axis.
  # Depth is capped by `max_split_depth` (one base cell can produce
  # at most 2 ** max_split_depth leaves).
  #
  # split_floor accepts a numeric value OR the literal "origami" --
  # "origami" means: split when the model is worse than plain
  # Origami on this round's data.
  split_floor: 0.83
  # A below-floor cell is SPLIT only when its `sel_eff_new` did NOT
  # improve over the prior round's `sel_eff` by at least this delta
  # -- i.e. "data augmentation has stopped helping, carve the cell".
  # Combined with `split_after_attempts`, this codifies the operator
  # rule: split a cell ONLY if data was augmented enough (N rounds)
  # but sel_eff did not improve. Set to 0 to disable the not-
  # improving check (then SPLIT triggers purely on attempts + floor).
  split_min_improvement: 0.02
  # SPLIT requires the cell to have already received this many
  # rounds of augmented training (counted from the cumulative
  # retrain history). Default 2 means a below-floor cell gets two
  # full rounds of data-augmentation + fresh-init retraining BEFORE
  # being carved. Larger values bias against splitting (more data
  # first); 0 splits below-floor cells immediately.
  # In a long run, 1 lets a below-bar cell split after a single
  # non-improving retrain, so carving starts ~round 2 and depth grows
  # every ~2 rounds; 2 delays the first carve to round 3 (and keeps
  # round_1 at the 96-cell base, so its cost stays flat).
  # 0 here. Split candidacy needs
  #   prior_retrain_attempts >= split_after_attempts
  # and the FINAL round converts every split back to retrain (no round left
  # to train the children). So in an N-round run the only splittable rounds
  # are 1..N-2, and a cell has (round-1) attempts when evaluated.
  #   N=3, after_attempts=1 -> round_1 has 0 attempts (0>=1 false), round_2 is
  #                            final => ZERO splits are possible, ever.
  #   N=3, after_attempts=0 -> round_1 splits, round_2 trains the children.
  # In a short run a non-zero value makes the gate, not the data, the
  # blocker: cells score below the floor and still never split.
  # NOTE: a 2-round run cannot split at all (round_1 is final).
  split_after_attempts: 0
  # Cost per active round is leaves x shapes_per_cell GEMMs, so the split
  # tree is what makes late rounds expensive. Depth d allows one base cell
  # to become 2**d leaves (64 at depth 6), and a long run can grow the tree
  # to several times the 96 base cells.
  # Depth 1 caps the tree at 2 x 96 = 192 leaves while still exercising the
  # split path end to end. Deep trees only pay off when later rounds can
  # refine the children, and with only a few rounds (splitting disabled on
  # the final round) there is little room for that anyway.
  max_split_depth: 1
  # STRUCTURAL width-split guarantee (0 = off). Set >0 (e.g. 6.0) to carve
  # any leaf whose widest splittable axis (Large M/N, LargeK) spans more
  # than this many octaves REGARDLESS of synthetic sel_eff -- a guarantee
  # against wide cells mis-PASSing the bar on same-distribution synthetic
  # shapes yet failing on real OOD data. Left at 0.0 so the sel_eff
  # threshold alone drives splitting (the baseline); the 0.95 bar plus a
  # low split_after_attempts already carves Large|Large|LargeK. Set to 6.0
  # to add the structural guarantee.
  structural_split_min_octaves: 0.0

# `--mode full` runs round_0 (initial) followed by (total_rounds - 1)
# active rounds under the SAME run dir. Resume any mid-run crash via
# --run-dir <existing> --from-round R --from-stage N.
full:
  # BBS costs more than MXFP8 per shape (more Origami candidates) and its
  # larger code object makes the per-block load longer, so a third round
  # would not fit the time budget. 2 rounds still exercises the full chain
  # incl. stage06 deploy + stage07 parity, which only fire on the FINAL
  # round.
  total_rounds: 2

# Stage 06 deploy (formerly numbered stage07).
# stage06 fires automatically when ANY of these is
# true, in addition to whenever you pass `--deploy` on the
# orchestrator CLI:
#   * `target_sel_eff` is a number AND this round's global_sel_eff
#     (from stage05/metrics.json) is >= that number, OR
#   * we're at the LAST round of `--mode full` and `on_final_round`
#     is true.
# If `stop_when_target_reached` is true, hitting target_sel_eff also
# stops the orchestrator from running further rounds.
deploy:
  target_sel_eff: 0.95
  on_final_round: true
  stop_when_target_reached: false

  # Precision the deployed .bin stores the MLP `.weight` matrices in.
  #   bf16 (default) -- top 16 bits of each float32 weight; ~halves
  #     the binary (weights dominate the per-cell payload). The C++
  #     runtime promotes bf16->fp32 at load and computes in fp32, and
  #     stage 7's parity check rounds the Python weights identically,
  #     so C++<->Python picks stay bit-for-bit identical. Biases /
  #     whitening / temperature remain fp32.
  #   fp32 -- legacy full precision (larger .bin, no behavior change).
  weight_dtype: int8

  # `rocm_libraries_to_deploy` is the rocm-libraries CHECKOUT that
  # stage06 modifies. We ASSUME the kernels in this checkout are
  # already built (the `.dat` libraries under
  # `projects/hipblaslt/build/release/Tensile/library/<arch>/` exist),
  # and the origami source tree under `shared/origami/` is already
  # plumbed into the build system. stage06's job is then just to drop
  # in the new model + relink:
  #   1. Weights binary -> <repo>/shared/origami/data/
  #                          ml_recommender_weights.bin
  #   2. C++ inference  -> <repo>/shared/origami/src/origami/
  #                          ml_recommender.cpp
  #      C++ header     -> <repo>/shared/origami/include/origami/
  #                          ml_recommender.hpp
  #      (These two are the GRID-aware replacement for the prior
  #       cluster-based files in that branch; the public API on the
  #       hipBLASLt side -- ProblemPredictionLibrary +
  #       Debug::useMLRecommender -- is unchanged. NO tensilelite
  #       headers are edited; NO .bak files are created.)
  #   3. Install docs   -> <repo>/shared/origami/ML_RECOMMENDER_INSTALL.md
  # When null, stage06 only emits to <round>/stage06/staged_for_deploy/
  # and the operator does the drop-in manually.
  # ${TILEWRIGHT_DEPLOY_ROOT} is expanded at load time like every config
  # string and must be set; scripts/run_gfx1250v0.sh exports it, defaulting
  # to the rocm-libraries checkout this pipeline lives in.
  rocm_libraries_to_deploy: ${TILEWRIGHT_DEPLOY_ROOT}

  # If false, stage06 stops after staging changes under
  # <round>/stage06/staged_for_deploy/ (a mirror of what WOULD be
  # written into the repo) and prints a diff -- the operator can
  # inspect, then rerun with apply_patch=true. If true, stage06
  # actually overwrites the files in `rocm_libraries_to_deploy`.
  # STAGING ONLY -- deliberately false.
  #
  # The deploy checkout's BUILD must carry the library this model is trained
  # against. An older gfx1250 Tensile build ships
  #     TensileLibrary_F8F8_BF8_MXAE8B32_MXBE8B32_UA_Type_F8B_...
  # (no _HA_, no _Bias_SAV_), while this model is trained on
  #     TensileLibrary_F8F8_BF8_HA_MXAE8B32_MXBE8B32_Bias_SAV_UA_Type_F8B_...
  # which only exists in a build from the newer logic.
  #
  # stage06 names the .bin after the library stem it serves and registers that
  # stem in `tilewright_index`. With no matching stem it falls back to the
  # legacy global name, which the runtime's per-library lookup never consults:
  # the .bin would ship and simply never load. That is worse than not
  # shipping it, because it looks deployed.
  #
  # Flip to true once the deploy checkout is BUILT from logic that carries
  # the target stem. Until then stage06 stages the bundle under
  # <round>/stage06/staged_for_deploy/ for inspection.
  apply_patch: false

  # When apply_patch is true AND build_after_apply is true, stage06
  # also relinks the parts of the deploy repo that consume the new
  # model. The kernels are NOT rebuilt -- they're assumed live. The
  # steps actually run are:
  #   (a) cmake --build <repo>/shared/origami/build --parallel <jobs>
  #         -- rebuilds libOrigami + the origami Python binding `.so`
  #         (it embeds ml_recommender.cpp)
  #   (b) make -C <repo>/projects/hipblaslt/build/release/clients
  #         -j <jobs>
  #         -- relinks hipblaslt-bench against the new libOrigami
  #   (c) cp <repo>/shared/origami/build/python/src/origami/origami.cpython-*.so
  #            <python_site_packages>/origami/
  #         -- so the offline-eval Python path
  #            (stage08_validate_sel_eff) sees the new library too.
  #            The dest is auto-detected from `sys`.
  # Output is tee'd to <round>/stage06/build.log. Cost: a couple of
  # minutes (origami is small; we're only relinking hipblaslt-bench,
  # not rebuilding any kernels).
  #
  # NB: FALSE here, for a deploy checkout at `rocm_libraries_to_deploy`
  # whose origami cmake build is not configured
  # (`shared/origami/build/` is missing). With
  # build_after_apply=false the .bin is still copied into the
  # checkout's `shared/origami/data/` -- the operator can run
  # `cmake -S shared/origami -B shared/origami/build
  # -DORIGAMI_ENABLE_PYTHON=ON && cmake --build shared/origami/build`
  # by hand and flip this back to true once that's done.
  build_after_apply: false
  # null lets the build commands pick the parallelism; set to int to
  # override.
  build_jobs: null

# Stage 07 + Stage 08 -- OPTIONAL post-deploy validation.
#
# Triggered together by the orchestrator with `--mode validate
# --run-dir <existing>`. Validate mode reads ONLY the two lists below
# (`stage07.bench_yamls` and `stage08.datasets`); every other knob is
# derived from the sections you've already configured:
#
#   * devices               <- runtime.devices
#                              (stage 7 single-device runs use the
#                               first; stage 8 multi-GPU offline-tune
#                               uses all)
#   * blocks_per_gpu        <- bench.blocks_per_gpu
#   * sel_eff_threshold     <- validate.sel_eff_threshold
#   * min_cell_gemms        <- validate.min_cell_gemms
#   * torch_device          <- train.device
#   * rocm_libraries        <- deploy.rocm_libraries_to_deploy
#                              (for stage 7's hipblaslt-bench + stage 8's
#                               enrich paths). Stage 8 falls back to
#                               runtime.rocm_libraries_root if that
#                               build is incomplete.
#   * arch                  <- arch
#   * iters / cold_iters    stage 7 uses 1/0 so selection time
#                              dominates -- never duplicate these
#                              here.
#
# To VERIFY the tilewright model is actually active (vs falling back
# to plain Origami), stage 7 runs its ML-on bench with
#   TENSILE_USE_TILEWRIGHT=1 TILEWRIGHT_DIAG=1 TILEWRIGHT_PICK_LOG=1
# and its ML-off baseline with none of them. The runtime finds weights
# only through a `tilewright_index` beside the Tensile library .dat
# (stage06 stages them; `build_after_apply` runs the colocate step).
# With TILEWRIGHT_DIAG=1 it prints a one-shot stderr line
#   [TILEWRIGHT_DIAG FILE] ... arch=... qhash=... n_cells=N n_splits=K
# when a weights .bin loads -- a missing line means the runtime
# could not find / open / parse the weights and is silently using
# plain Origami. Stage 7's summary flags whether this marker was
# seen in each bench log.
stage07:
  # Time + parity-check this many random UNIQUE shapes sampled from the
  # TRAINED dataset (the union of every round_*/stage01/shapes.yaml)
  # instead of an external bench yaml. These are in-distribution shapes
  # the deployed cells actually serve and are guaranteed to match this
  # run's dtype/layout, so stage07's workload filter never drops them as
  # OOD. With this set > 0, `bench_yamls` is not consulted at all, which
  # is why none is listed here.
  parity_sample_trained: 1000

stage08:
  # Empty: stage08 is skipped. Add `{name, path, rocm_libraries_used}`
  # entries (paths may use ${TILEWRIGHT_DATASETS}, which whoever runs the
  # config must export) to evaluate on external traces.
  # `datasets` is the only key stage08 reads; an empty list makes the
  # orchestrator's `elif datasets:` gate a clean no-op, which is the
  # documented way to skip the stage. stage07 still runs, because
  # `stage07.parity_sample_trained` above is non-zero.
  #
  # Note there is deliberately no `--from-stage` value that skips 8 while
  # keeping 7 (the gates are from_stage > 7.0 and > 8.0), so emptying the
  # list here is the correct mechanism, not a CLI flag.
  datasets: []
